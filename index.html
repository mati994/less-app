    function shifted(days){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return d}
    function safeText(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function demoData(){const checkins={};for(let i=1;i<=30;i++)checkins[dateKey(shifted(-i))]=i===8||i===19?'no':'yes';return {isDemo:true,habit:'Weniger Scrollen.',mode:'reduce',goal:'Maximal 45 Minuten Social Media am Tag',created:dateKey(shifted(-30)),checkins}}
    function load(){try{const val=JSON.parse(localStorage.getItem(KEY));if(val&&typeof val.habit==='string'&&val.checkins&&typeof val.checkins==='object')return val}catch(e){}return demoData()}
    let data=load(), tab='home', modal=null, toastTimer=null, pendingDate=null;
    const root=document.getElementById('app'), modalRoot=document.getElementById('modal-root');
    function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Speichern ist in diesem Browser nicht möglich.')}}
    function metrics(){let yes=0,recorded=0,lastSuccess=0,lastRecorded=0,streak=0;Object.entries(data.checkins).forEach(([d,val])=>{if(d<=dateKey(new Date())&&val==='yes')yes++;if(d<=dateKey(new Date())&&(val==='yes'||val==='no'))recorded++});for(let i=0;i<30;i++){const v=data.checkins[dateKey(shifted(-i))];if(v==='yes'){lastSuccess++;lastRecorded++}else if(v==='no')lastRecorded++}let start=data.checkins[dateKey(shifted(0))]==='yes'?0:1;for(let i=start;i<12000;i++){if(data.checkins[dateKey(shifted(-i))]==='yes')streak++;else break}return {yes,recorded,lastSuccess,lastRecorded,streak,pct:lastRecorded?Math.round(lastSuccess/lastRecorded*100):null}}
    function logo(){return `<div class="brand"><svg class="brandmark" viewBox="0 0 36 36" fill="none"><defs><linearGradient id="markgrad" x1="0" y1="0" x2="36" y2="36"><stop stop-color="#e8cfca"/><stop offset="1" stop-color="#aa90dd"/></linearGradient></defs><circle cx="18" cy="18" r="13" stroke="url(#markgrad)" stroke-width="3.2" stroke-dasharray="63 19" transform="rotate(-65 18 18)"/></svg>less.</div>`}
    function header(){return `<header class="brandrow">${logo()}<button class="iconbutton" aria-label="Einstellungen" data-tab="more">${icons.settings}</button></header>`}
    function bottom(){return `<nav class="bottom-nav" aria-label="Hauptnavigation">${[['home','Heute',icons.home],['history','Verlauf',icons.calendar],['more','Mehr',icons.more]].map(([name,title,icon])=>`<button class="tab ${name===tab?'active':''}" data-tab="${name}" aria-label="${title}" aria-current="${name===tab?'page':'false'}">${icon}<span>${title}</span><i class="dot"></i></button>`).join('')}</nav>`}
    function home(){const m=metrics(),todayVal=data.checkins[dateKey(new Date())],ratio=m.pct===null?0:m.pct,openness=.24+.42*(1-Math.exp(-m.yes/45)),ringTotal=(2*Math.PI*105).toFixed(2),arc=(2*Math.PI*105*(1-openness)).toFixed(2),fmtDate=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'}).format(new Date()),done=!!todayVal;
      return `<section class="screen">${header()}<div class="header-date">${safeText(fmtDate)}</div><div class="focus"><div class="eyebrow">Dein Fokus</div><h1 class="habit-title">${safeText(data.habit)}</h1><p class="habit-sub">${safeText(data.goal||'Ein Tag nach dem anderen. In deinem Tempo.')}</p>${data.isDemo?'<span class="demo-badge">✳ DEMO · Zum Ausprobieren</span>':''}</div>
      <div class="hero" aria-label="${m.yes} erfolgreiche Tage"><div class="halo"></div><svg class="orbit" viewBox="0 0 260 260" fill="none" aria-hidden="true"><defs><linearGradient id="progressGradient" x1="8" y1="0" x2="225" y2="260"><stop stop-color="#ffddd2"/><stop offset=".52" stop-color="#cda9e4"/><stop offset="1" stop-color="#8d99d4"/></linearGradient></defs><circle class="back" cx="130" cy="130" r="105"/><circle class="front" cx="130" cy="130" r="105" data-arc="${arc}" style="stroke-dasharray:${arc} ${ringTotal};stroke-dashoffset:0"/></svg><div class="hero-metric"><div class="metric-number">${m.yes}</div><div class="hero-caption"><div class="metric-label">bewusst gewonnene Tage</div><div class="metric-note">Jeder einzelne zählt.</div></div></div></div>
      <div class="stats"><div class="stat"><div class="stat-top">Deine aktuelle Serie</div><div class="stat-value">${m.streak}<span>Tage</span><span class="stat-icon">${icons.sparkle}</span></div><div class="stat-graphic"><i style="width:${Math.min(m.streak/30,1)*100}%"></i></div></div><div class="stat"><div class="stat-top">Letzte 30 Tage</div><div class="stat-value">${m.pct===null?'–':`${m.pct} %`}</div><div class="stat-graphic"><i style="width:${ratio}%"></i></div></div></div>
      <section class="check-container"><div class="today-label"><span>Dein täglicher Moment</span><strong>${done?(todayVal==='yes'?'HEUTE ERREICHT':'HEUTE EINGETRAGEN'):'NOCH OFFEN'}</strong></div><button class="primary-button" data-check="today"><span>${done?'Check-in bearbeiten':'Check-in für heute'}</span>${done?icons.check:icons.arrow}</button></section><div class="mini-footer"><span class="footer-copy">Fortschritt ist nicht immer geradlinig.</span><button class="text-button" data-tab="history">Verlauf ansehen ↗</button></div>${bottom()}</section>`}
    function history(){const m=metrics(),days=[],start=shifted(-29);for(let i=0;i<30;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}const leading=(start.getDay()+6)%7;let cal=weekdayShort.map(x=>`<div class="cal-day">${x}</div>`).join('');for(let i=0;i<leading;i++)cal+='<div></div>';
      cal+=days.map(d=>{const k=dateKey(d),s=data.checkins[k]||'',css=s==='yes'?'success':s==='no'?'miss':'',label=s==='yes'?'Ziel erreicht':s==='no'?'Ziel nicht erreicht':'Nicht erfasst';return `<button class="date-item ${css} ${k===dateKey(new Date())?'today':''}" data-day="${k}" title="${safeText(d.toLocaleDateString('de-DE'))} – ${label}" aria-label="${safeText(d.toLocaleDateString('de-DE'))}: ${label}">${d.getDate()}</button>`}).join('');
      return `<section class="screen">${header()}<h1 class="page-heading">Dein Weg.</h1><p class="page-intro">Nicht jeder Tag muss perfekt sein, damit du vorankommst. Tippe auf einen Tag, um ihn einzutragen oder zu ändern.</p><div class="panel"><div class="history-overview"><strong>${m.lastSuccess}</strong><span>erfolgreiche Tage<br>in den letzten 30 Tagen</span></div><div class="divider"></div><div class="calendar-grid">${cal}</div><div class="legend"><span><i class="yes"></i> Erreicht</span><span><i class="no"></i> Nicht erreicht</span><span><i></i> Ohne Eintrag</span></div></div><p class="history-note">Ein Tag ohne Check-in bleibt offen. Er wird nicht automatisch als Rückschritt gezählt.</p><div style="flex:1"></div>${bottom()}</section>`}
    function more(){return `<section class="screen">${header()}<h1 class="page-heading">Dein Raum.</h1><p class="page-intro">So viel wie nötig. So wenig wie möglich. Du bestimmst, wie du less. nutzt.</p><button class="settings-action" data-action="new"><span>Eigene Gewohnheit festlegen<small>Ein neues Ziel statt der Demo beginnen.</small></span>${icons.arrow}</button><button class="settings-action" data-action="demo"><span>Demo zurücksetzen<small>28 Beispieltage und die Startansicht laden.</small></span>${icons.arrow}</button><button class="settings-action" data-action="export"><span>Einträge exportieren<small>Deine Daten als JSON-Datei sichern.</small></span>${icons.arrow}</button><button class="settings-action" data-action="erase"><span>Einträge löschen<small>Alle lokalen Einträge entfernen.</small></span>${icons.arrow}</button><div class="notice" style="margin-top:18px">Deine Einträge bleiben in diesem Browser gespeichert. Es gibt keinen Account und keine Datenübertragung an einen Server. Benachrichtigungen sind für eine spätere Version vorgesehen.</div><div style="flex:1"></div>${bottom()}</section>`}
    let formMode='abstain';
    function setup(){tab='setup';root.innerHTML=`<section class="screen onboarding">${logo()}<div class="eyebrow">Ein Anfang genügt</div><h1>Was möchtest du loslassen?</h1><p>Eine Gewohnheit. Ein klarer Fokus. Du musst nicht alles auf einmal verändern.</p><form id="habit-form"><label for="habit-name" class="field">DEIN FOKUS</label><input id="habit-name" class="field-input" maxlength="48" required placeholder="z. B. Nicht mehr rauchen" autocomplete="off"><label class="field">DEIN WEG</label><div class="mode-group"><button type="button" class="mode-option selected" data-mode="abstain">Ganz verzichten</button><button type="button" class="mode-option" data-mode="reduce">Bewusst reduzieren</button></div><label for="habit-goal" class="field">DEIN ZIEL (OPTIONAL)</label><input id="habit-goal" class="field-input" maxlength="100" placeholder="z. B. Jeden Tag ohne Zigarette" autocomplete="off"><p class="helper">Einmal täglich hältst du fest, ob du dein Ziel erreicht hast. Keine Stimmungstests, kein Urteil.</p><button type="submit" class="primary-button"><span>Meinen Weg beginnen</span>${icons.arrow}</button></form><button class="back-link" data-action="back">Zurück zur Ansicht</button></section>`}
    function render(){
      const previousArc=root.querySelector('.orbit .front')?.getAttribute('data-arc');
      if(tab==='setup'){setup();return}
      root.innerHTML=tab==='history'?history():tab==='more'?more():home();
      const newArc=root.querySelector('.orbit .front');
      const currentArc=newArc?.getAttribute('data-arc');
      if(previousArc&&currentArc&&previousArc!==currentArc&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        const c=(2*Math.PI*105).toFixed(2);
        newArc.animate([{strokeDasharray:previousArc+' '+c},{strokeDasharray:currentArc+' '+c}],{duration:1050,easing:'cubic-bezier(.2,.8,.2,1)'});
      }
      window.scrollTo({top:0,behavior:'instant'});
    }
    function sheet(content){modalRoot.innerHTML=`<div class="overlay" id="sheet-overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="Check-in"><div class="handle"></div><button class="sheet-close" aria-label="Schließen" data-action="close">×</button>${content}</div></div>`;modal='open'}
    function closeSheet(){modalRoot.innerHTML='';modal=null;pendingDate=null}
    function checkin(date){pendingDate=date;const d=new Date(`${date}T12:00:00`),dateLabel=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'}).format(d),current=data.checkins[date];const phrase=data.mode==='abstain'?'Heute darauf verzichtet':'Heute mein Ziel erreicht';sheet(`<div class="eyebrow" style="margin-top:42px">Ein bewusster Moment</div><h2>Wie lief dein Tag?</h2><p>${safeText(dateLabel)} · Ein ehrlicher Check-in reicht. Ohne weitere Fragen.</p><button class="choice" data-result="yes"><span class="choiceicon">${icons.check}</span><span><strong>${phrase}</strong><small>Du bist deinem Vorhaben treu geblieben.</small></span></button><button class="choice" data-result="no"><span class="choiceicon">${icons.close}</span><span><strong>Heute nicht erreicht</strong><small>Das ist ein Tag, nicht deine ganze Geschichte.</small></span></button>${current?'<button class="neutral-link" data-result="clear">Eintrag für diesen Tag entfernen</button>':'<button class="neutral-link" data-action="close">Später eintragen</button>'}`)}
    function showResult(type){const success=type==='yes';sheet(`<div class="success-panel"><div class="result-symbol"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="23" stroke="${success?'#ddc2f3':'#c2b6d3'}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="107 38" transform="rotate(-60 32 32)"/></svg></div><div class="eyebrow" style="justify-content:center">${success?'Ein Schritt nach vorn':'Ein Teil deines Weges'}</div><h2>${success?'Du hast Raum geschaffen.':'Morgen ist ein neuer Tag.'}</h2><p>${success?'Ein erfolgreicher Tag mehr. Du musst niemandem etwas beweisen.':'Deine bisherigen Erfolge bleiben. Du kannst einfach weitermachen.'}</p><button class="primary-button" data-action="close"><span>Weiter</span>${icons.arrow}</button></div>`)}
    function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2600)}
    document.addEventListener('click',e=>{
      const btn=e.target.closest('button');if(!btn){if(e.target.id==='sheet-overlay')closeSheet();return}
      if(btn.dataset.tab){tab=btn.dataset.tab;render();return}
      if(btn.dataset.check){checkin(dateKey(new Date()));return}
      if(btn.dataset.day){checkin(btn.dataset.day);return}
      if(btn.dataset.result){const val=btn.dataset.result;if(!pendingDate)return;if(val==='clear')delete data.checkins[pendingDate];else data.checkins[pendingDate]=val;data.isDemo=false;save();closeSheet();render();if(val==='clear')toast('Eintrag entfernt');else showResult(val);return}
      if(btn.dataset.mode){formMode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x.dataset.mode===formMode));document.getElementById('habit-goal').placeholder=formMode==='reduce'?'z. B. Maximal 30 Minuten pro Tag':'z. B. Jeden Tag ohne Zigarette';return}
      switch(btn.dataset.action){case 'close':closeSheet();break;case 'back':tab='home';render();break;case 'new':formMode='abstain';setup();break;case 'demo':if(confirm('Die bisherigen Einträge werden durch Beispieldaten ersetzt. Fortfahren?')){data=demoData();save();tab='home';render();toast('Demo geladen')}break;case 'erase':if(confirm('Alle Einträge wirklich löschen?')){data.checkins={};data.isDemo=false;save();tab='home';render();toast('Einträge gelöscht')}break;case 'export':{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='less-meine-daten.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Datenexport gestartet');break}}
    });
    document.addEventListener('submit',e=>{if(e.target.id!=='habit-form')return;e.preventDefault();const habit=document.getElementById('habit-name').value.trim(),goal=document.getElementById('habit-goal').value.trim();if(!habit)return;const hadRecords=Object.keys(data.checkins).length;if(hadRecords&&!confirm('Damit beginnt ein neues Ziel. Die bisherigen Einträge werden ersetzt. Weiter?'))return;data={isDemo:false,habit,goal,mode:formMode,created:dateKey(new Date()),checkins:{}};save();tab='home';render();toast('Dein neues Ziel ist bereit')});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
    save();render();
    const splash=document.getElementById('splash'),appShell=document.getElementById('app');
    const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function finishIntro(){
      const source=splash?.querySelector('.splash-logo svg');
      const target=root.querySelector('.hero .orbit');
      if(reduceMotion||!source||!target||typeof source.animate!=='function'){
        appShell.classList.remove('booting','morphing');
        splash?.remove();
        return;
      }
      const from=source.getBoundingClientRect(),to=target.getBoundingClientRect();
      if(!from.width||!to.width){appShell.classList.remove('booting','morphing');splash.remove();return}
      const floating=source.cloneNode(true);
      floating.classList.add('travel-ring');
      floating.setAttribute('aria-hidden','true');
      Object.assign(floating.style,{left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px'});
      document.body.append(floating);
      source.style.visibility='hidden';
      splash.classList.add('traveling');
      // The original mark keeps its shape. As it flies, the stroke gets thinner,
      // opens to the user's current progress, and aligns with the dashboard orbit.
      const openness=.24+.42*(1-Math.exp(-metrics().yes/45));
      const endSize=to.width*1.124;
      const endLeft=to.left+(to.width-endSize)/2;
      const endTop=to.top+(to.height-endSize)/2;
      const circle=floating.querySelector('circle');
      circle?.animate([
        {strokeWidth:'5',strokeDasharray:'107 38',transform:'rotate(-60deg)',transformOrigin:'50% 50%'},
        {strokeWidth:'.65',strokeDasharray:(2*Math.PI*23*(1-openness)).toFixed(2)+' 145',transform:'rotate(-95deg)',transformOrigin:'50% 50%'}
      ],{duration:1050,easing:'cubic-bezier(.2,.76,.2,1)',fill:'forwards'});
      const flight=floating.animate([
        {left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px'},
        {left:endLeft+'px',top:endTop+'px',width:endSize+'px',height:endSize+'px'}
      ],{duration:1050,easing:'cubic-bezier(.2,.76,.2,1)',fill:'forwards'});
      setTimeout(()=>{splash.classList.add('out');appShell.classList.remove('booting');appShell.classList.add('entering')},320);
      const done=()=>{
        appShell.classList.remove('morphing','entering');
        floating.animate([{opacity:1},{opacity:0}],{duration:210,fill:'forwards'}).onfinish=()=>floating.remove();
        splash.remove();
      };
      flight.onfinish=done;
      flight.oncancel=done;
    }
    setTimeout(finishIntro,reduceMotion?100:1400);
  })();
  </script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }
  </script>
</body>
</html>
